name: 'Tests: node.js >= 10'

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Space-separated test files to run instead of the whole suite; empty runs everything.'
        required: false
        default: ''

jobs:
  # Upstream delegates this job to `ljharb/actions/.github/workflows/node.yml@main`,
  # which resolves its minors matrix externally and cannot drive a fork, so the legs
  # are expanded explicitly here. The command it ran — `npm run tests-only` — is kept
  # verbatim.
  tests:
    name: 'node ${{ matrix.node-version }}'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Upstream's `range: '>= 10'` resolved, at this release's date, to the
        # 10..18 minors. This version pins `nyc: ^10.3.2` (spawn-wrap 1.x), which
        # was never exercised above node 18, so the legs stay inside the range
        # upstream actually covered in June 2022.
        node-version: [18, 16, 14]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 'pin the npm registry to the release date'
        run: npm config set registry 'https://:2022-06-06T19%3A07%3A09.851Z@time-machines-npm.sealsecurity.io/'

      - run: npm install

      # Full suite by default (`npm run tests-only` verbatim). A non-empty
      # `test-filter` must run ONLY the named files, and `scripts.tests-only` is
      # `nyc tape 'test/**/*.js'` — appending to that would run the whole suite
      # alongside the selection — so the filtered path drives the same nyc+tape
      # runner directly with the glob replaced by the selection.
      - name: 'npm run tests-only'
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npx nyc tape ${{ inputs.test-filter }}
          else
            npm run tests-only
          fi

  # Upstream never packs, so the release tarball is produced here.
  pack:
    name: 'npm pack'
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The public tarball was packed with node 18.3.0 / npm 8.11.0, so the pack
      # leg stays on node 18 and its bundled npm 8.
      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 'pin the npm registry to the release date'
        run: npm config set registry 'https://:2022-06-06T19%3A07%3A09.851Z@time-machines-npm.sealsecurity.io/'

      - run: npm install

      # `prepack` (`npmignore --auto --commentLines=autogenerated`) applies
      # `publishConfig.ignore` and is what the published tarball is built from, so
      # `npm pack` runs with lifecycle scripts enabled. Unlike later 6.x releases,
      # this version's `prepack` does NOT run `npm run dist`: `dist/qs.js` is
      # committed and republished as-is, so browserify is never invoked here.
      - run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: qs-tarball
          path: qs-6.10.4.tgz
          if-no-files-found: error

  node:
    name: 'node >= 10'
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: 'echo tests completed'
